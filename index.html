<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدوات PDF — حوّل، ادمج، قسّم، اضغط</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16313a;--paper:#f2f5f4;--card:#fff;--line:#d3dcda;--main:#0e6b66;--hot:#e2552d;--muted:#5d726f}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7}
header{padding:40px 20px 8px;max-width:760px;margin:auto}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 6px;font-weight:700}
header p{margin:0;color:var(--muted)}
main{max-width:760px;margin:auto;padding:20px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.tab{padding:12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px}
.drop{display:block;border:2px dashed var(--main);border-radius:12px;padding:40px 16px;text-align:center;cursor:pointer;background:#f7fbfa}
.drop.over{background:#e3f2f0}
.drop strong{display:block;font-size:1.15rem}
.drop span{color:var(--muted);font-size:.9rem}
#file{display:none}
.pad{width:100%;height:160px;background:#fff;border:1.5px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.link{border:0;background:none;color:var(--main);font:inherit;cursor:pointer;padding:4px 0}
.opt+.opt{margin-top:10px}
ul{list-style:none;padding:0;margin:14px 0}
li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--paper);border-radius:8px;margin-bottom:6px;font-size:.95rem}
li button{border:0;background:none;color:var(--hot);cursor:pointer;font:inherit}
.opt{margin:14px 0}
.opt label{display:block;font-weight:500;margin-bottom:4px}
.opt input:not([type=range]),.opt select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--hot);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;min-height:1.5em;font-weight:500}
.msg.err{color:#b3261e}
.msg a{color:var(--main)}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
footer{max-width:760px;margin:auto;padding:10px 20px 40px;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<header>
  <a href="/account" id="acct" style="float:left;color:var(--main);font-weight:500">حسابي</a>
  <h1>أدوات PDF</h1>
  <p>ارفع ملفك، اختر الأداة، حمّل النتيجة. تُحذف الملفات من الخادم تلقائيًا بعد ساعتين من المعالجة.</p>
</header>
<main>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf">
      <strong id="dropTitle">اضغط لاختيار ملف PDF</strong>
      <span>أو اسحب الملف وأفلته هنا (حتى 50 ميجابايت)</span>
    </label>
    <ul id="list"></ul>
    <div class="opt" id="opts"></div>
    <button class="go" id="go" disabled>تحويل</button>
    <div class="msg" id="msg" role="status"></div>
  </section>
</main>
<footer><p id="price"></p><p><a href="/policy/terms">الشروط والأحكام</a> · <a href="/policy/privacy">الخصوصية</a> · <a href="/policy/refund">الاسترجاع</a></p>الملفات الممسوحة ضوئيًا تحتاج OCR وغير مدعومة في هذه النسخة.</footer>
<script>
const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
const sel = (name, items) => `<select name="${name}">${items.map(([v,l,d]) => `<option value="${v}"${d?" selected":""}>${l}</option>`).join("")}</select>`;
const TOOLS = {
  "pdf-to-word": {name:"PDF إلى Word", btn:"حوّل إلى Word", ok:isPdf, accept:"application/pdf", title:"اضغط لاختيار ملف PDF"},
  "word-to-pdf": {name:"Word إلى PDF", btn:"حوّل إلى PDF", ok:f=>/\.docx?$/i.test(f.name), accept:".doc,.docx", title:"اضغط لاختيار ملف Word"},
  "pdf-to-images": {name:"PDF إلى صور", btn:"حوّل إلى صور", ok:isPdf, accept:"application/pdf", title:"اضغط لاختيار ملف PDF"},
  "images-to-pdf": {name:"صور إلى PDF", btn:"اجمع الصور في PDF", multi:true, min:1, ok:f=>/^image\//.test(f.type), accept:"image/*", title:"اختر صورة أو أكثر (بالترتيب المطلوب)"},
  "merge": {name:"دمج PDF", btn:"ادمج الملفات", multi:true, min:2, ok:isPdf, accept:"application/pdf", title:"اختر ملفين PDF أو أكثر"},
  "split": {name:"تقسيم PDF", btn:"قسّم الملف", ok:isPdf, accept:"application/pdf", title:"اضغط لاختيار ملف PDF",
    opt:'<label for="ranges">الصفحات المطلوبة (اختياري)</label><input id="ranges" name="ranges" placeholder="مثال: 1-3, 5, 8 — اتركه فارغًا لفصل كل صفحة">'},
  "compress": {name:"ضغط PDF", btn:"اضغط الملف", ok:isPdf, accept:"application/pdf", title:"اضغط لاختيار ملف PDF",
    opt:'<label>مستوى الضغط</label>'+sel("level",[["high","أعلى ضغط (جودة أقل)"],["medium","متوسط",1],["low","جودة عالية"]])},
  "sign": {name:"إضافة توقيع", btn:"أضف التوقيع", ok:isPdf, accept:"application/pdf", title:"اضغط لاختيار ملف PDF",
    opt:'<div class="opt"><label>ارسم توقيعك بإصبعك أو بالفأرة</label><canvas id="pad" class="pad" width="600" height="200"></canvas><button type="button" class="link" id="clr">مسح التوقيع</button></div>'+
        '<div class="opt"><label for="sigfile">أو ارفع صورة توقيع (PNG بخلفية شفافة أفضل)</label><input type="file" id="sigfile" accept="image/*"></div>'+
        '<div class="opt"><label>الصفحة</label>'+sel("page",[["last","الأخيرة",1],["first","الأولى"],["all","كل الصفحات"]])+'</div>'+
        '<div class="opt"><label>المكان</label>'+sel("position",[["bottom-right","أسفل اليمين",1],["bottom-left","أسفل اليسار"],["bottom-center","أسفل الوسط"],["center","الوسط"]])+'</div>'+
        '<div class="opt"><label for="size">حجم التوقيع</label><input type="range" id="size" name="size" min="10" max="50" value="25"></div>',
    setup: setupPad, extra: async fd => {
      const up = $("sigfile").files[0];
      if (up) { fd.append("signature", up); return; }
      if (!padDrawn) return "ارسم توقيعك أو ارفع صورته أولًا";
      fd.append("signature", await new Promise(r => $("pad").toBlob(r, "image/png")), "sig.png");
    }},
  "watermark": {name:"علامة مائية", btn:"أضف العلامة المائية", ok:isPdf, accept:"application/pdf", title:"اضغط لاختيار ملف PDF",
    opt:'<div class="opt"><label for="wtext">نص العلامة</label><input id="wtext" name="text" placeholder="مثال: سري — نسخة للمراجعة"></div>'+
        '<div class="opt"><label for="wcolor">اللون</label><input type="color" id="wcolor" name="color" value="#888888"></div>'+
        '<div class="opt"><label for="wop">الشفافية (الأقل أخف)</label><input type="range" id="wop" name="opacity" min="10" max="80" value="30"></div>'+
        '<div class="opt"><label>التوزيع</label>'+sel("mode",[["center","نص واحد في الوسط",1],["tile","مكرر على الصفحة"]])+'</div>',
    extra: async fd => {
      const text = $("wtext").value.trim();
      if (!text) return "اكتب نص العلامة المائية";
      await document.fonts.load('700 100px "IBM Plex Sans Arabic"');
      const c = document.createElement("canvas"); c.width = c.height = 1200;
      const x = c.getContext("2d");
      x.translate(600, 600); x.rotate(-Math.PI / 4);
      x.font = '700 120px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      const w = x.measureText(text).width, k = Math.min(1, 1000 / w);
      x.font = `700 ${Math.floor(120 * k)}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
      x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl";
      x.globalAlpha = $("wop").value / 100; x.fillStyle = $("wcolor").value;
      x.fillText(text, 0, 0);
      fd.append("watermark", await new Promise(r => c.toBlob(r, "image/png")), "wm.png");
    }}
};
let tool = "pdf-to-word", files = [], padDrawn = false;
const $ = id => document.getElementById(id);

function setupPad(){
  padDrawn = false;
  const c = $("pad"), x = c.getContext("2d"); let down = false;
  x.lineWidth = 3; x.lineCap = x.lineJoin = "round"; x.strokeStyle = "#111";
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height]; };
  c.onpointerdown = e => { down = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...pt(e)); };
  c.onpointermove = e => { if(!down) return; x.lineTo(...pt(e)); x.stroke(); padDrawn = true; };
  c.onpointerup = () => down = false;
  $("clr").onclick = () => { x.clearRect(0,0,c.width,c.height); padDrawn = false; };
}
function renderTabs(){
  $("tabs").innerHTML = Object.entries(TOOLS).map(([k,t]) =>
    `<button class="tab" role="tab" aria-selected="${k===tool}" data-k="${k}">${t.name}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { tool = b.dataset.k; files = []; $("msg").textContent=""; render(); });
}
function render(){
  const t = TOOLS[tool];
  renderTabs();
  $("file").multiple = !!t.multi; $("file").accept = t.accept;
  $("dropTitle").textContent = t.title;
  $("opts").innerHTML = t.opt || "";
  if (t.setup) t.setup();
  $("go").textContent = t.btn;
  $("list").innerHTML = files.map((f,i) =>
    `<li><span>${f.name}</span><button data-i="${i}">حذف</button></li>`).join("");
  $("list").querySelectorAll("button").forEach(b => b.onclick = () => { files.splice(+b.dataset.i,1); render(); });
  $("go").disabled = files.length < (t.min || 1);
}
function addFiles(list){
  const t = TOOLS[tool], ok = [...list].filter(t.ok);
  if (!ok.length && list.length) { $("msg").className="msg err"; $("msg").textContent="نوع الملف غير مناسب لهذه الأداة"; return; }
  $("msg").textContent = "";
  files = t.multi ? files.concat(ok) : ok.slice(0,1);
  render();
}
$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

$("go").onclick = async () => {
  const fd = new FormData();
  files.forEach(f => fd.append("file", f));
  $("opts").querySelectorAll("[name]").forEach(el => fd.append(el.name, el.value));
  $("msg").className = "msg";
  const t = TOOLS[tool];
  if (t.extra) { const err = await t.extra(fd); if (err) { $("msg").className="msg err"; $("msg").textContent = err; return; } }
  $("go").disabled = true; $("msg").textContent = "جارٍ المعالجة…";
  try {
    const r = await fetch("/api/" + tool, {method:"POST", body:fd});
    if(!r.ok){ throw new Error((await r.json()).error || "حدث خطأ"); }
    const j = await r.json();
    $("msg").textContent = "الملف جاهز، جارٍ تحويلك لصفحة الدفع…";
    location.href = j.pay_url;
  } catch(e){ $("msg").className = "msg err"; $("msg").textContent = e instanceof TypeError ? "تعذّر الاتصال بالخادم. افتح الموقع من رابط الخادم نفسه (وليس كملف على الجوال أو من GitHub Pages)." : e.message; }
  $("go").disabled = false;
};
fetch("/api/me").then(r=>r.json()).then(m=>{$("price").textContent=`المعالجة مجانية، والتحميل بالاشتراك: ${m.plan.text}.`; if(m.anon) $("acct").textContent="تسجيل الدخول";});
render();
</script>
</body>
</html>
